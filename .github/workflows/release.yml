name: Release desktop apps

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  FFMPEG_VERSION: "9.0.1"
  FFMPEG_SHA256: "cf38e0e28c7e5605942c4a77755349b0145804a397af37eb1fb4c77cb237f635"

jobs:
  validate:
    name: Validate source and tag
    if: github.repository == 'ibaiGorordo/loopdrop'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verify that the tag matches package.json
        shell: bash
        run: |
          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const lock = JSON.parse(readFileSync("package-lock.json", "utf8"));
          const versionPattern = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/;
          if (!versionPattern.test(pkg.version)) {
            throw new Error(`package.json must contain a stable semantic version: ${pkg.version}`);
          }
          if (pkg.name !== "loopdrop") {
            throw new Error(`Unexpected package name: ${pkg.name}`);
          }
          if (pkg.license !== "MIT") {
            throw new Error(`Public releases require package.json license to be MIT, received: ${pkg.license}`);
          }
          if (lock.version !== pkg.version || lock.packages?.[""]?.version !== pkg.version) {
            throw new Error("package.json and package-lock.json versions must match exactly");
          }
          const expectedTag = `v${pkg.version}`;
          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`Release tag ${process.env.GITHUB_REF_NAME} must exactly equal ${expectedTag}`);
          }
          NODE

      - name: Verify annotated tag and protected-branch ancestry
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "push" || "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Releases must be triggered by a pushed tag." >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "$GITHUB_REF")" != "tag" ]]; then
            echo "Release tags must be annotated, not lightweight." >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          if [[ "$tag_commit" != "$(git rev-parse HEAD)" ]]; then
            echo "The checked-out commit does not match the release tag." >&2
            exit 1
          fi
          git show-ref --verify --quiet refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "The release tag must point to a commit reachable from origin/main." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run source checks
        run: npm run check

  ffmpeg-macos:
    name: FFmpeg macOS ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install FFmpeg build tools
        run: brew install nasm pkg-config

      - name: Build pinned LGPL-only FFmpeg
        run: ./scripts/build-ffmpeg-unix.sh "vendor/ffmpeg/${{ matrix.arch }}"

      - name: Verify FFmpeg policy and functionality
        shell: bash
        run: |
          set -euo pipefail
          output="vendor/ffmpeg/${{ matrix.arch }}"
          test "$(cat "$output/version.txt")" = "$FFMPEG_VERSION"
          ! grep -Eq -- '--enable-(gpl|nonfree|version3)' "$output/build-configuration.txt"
          filters="$("$output/ffmpeg" -hide_banner -filters 2>/dev/null)"
          grep -Fq palettegen <<<"$filters"
          grep -Fq paletteuse <<<"$filters"
          smoke_gif="$RUNNER_TEMP/ffmpeg-${{ matrix.arch }}-smoke.gif"
          "$output/ffmpeg" \
            -hide_banner -loglevel error -y \
            -filter_complex 'testsrc2=size=160x90:rate=8:duration=1,split[gif][palette];[palette]palettegen=max_colors=64[paletteout];[gif][paletteout]paletteuse[out]' \
            -map '[out]' -an -loop 0 "$smoke_gif"
          test -s "$smoke_gif"
          [[ "$(head -c 6 "$smoke_gif")" == GIF8[79]a ]]

      - name: Upload FFmpeg slice
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-macos-${{ matrix.arch }}
          path: |
            vendor/ffmpeg/${{ matrix.arch }}/ffmpeg
            vendor/ffmpeg/${{ matrix.arch }}/ffprobe
            vendor/ffmpeg/${{ matrix.arch }}/COPYING.LGPLv2.1
            vendor/ffmpeg/${{ matrix.arch }}/FFMPEG-LICENSE.md
            vendor/ffmpeg/${{ matrix.arch }}/build-configuration.txt
            vendor/ffmpeg/${{ matrix.arch }}/source-sha256.txt
            vendor/ffmpeg/${{ matrix.arch }}/source-url.txt
            vendor/ffmpeg/${{ matrix.arch }}/version.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  package-macos:
    name: Package signed universal macOS app
    needs:
      - validate
      - ffmpeg-macos
    runs-on: macos-15
    timeout-minutes: 60
    environment: release
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Download arm64 FFmpeg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-macos-arm64
          path: ffmpeg-slices/arm64

      - name: Download x64 FFmpeg
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-macos-x64
          path: ffmpeg-slices/x64

      - name: Assemble universal FFmpeg resources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/ffmpeg/current
          lipo -create \
            ffmpeg-slices/arm64/ffmpeg \
            ffmpeg-slices/x64/ffmpeg \
            -output vendor/ffmpeg/current/ffmpeg
          lipo -create \
            ffmpeg-slices/arm64/ffprobe \
            ffmpeg-slices/x64/ffprobe \
            -output vendor/ffmpeg/current/ffprobe
          chmod 0755 vendor/ffmpeg/current/ffmpeg vendor/ffmpeg/current/ffprobe
          lipo vendor/ffmpeg/current/ffmpeg -verify_arch arm64 x86_64
          lipo vendor/ffmpeg/current/ffprobe -verify_arch arm64 x86_64
          cp ffmpeg-slices/arm64/COPYING.LGPLv2.1 vendor/ffmpeg/current/
          cp ffmpeg-slices/arm64/FFMPEG-LICENSE.md vendor/ffmpeg/current/
          cp ffmpeg-slices/arm64/version.txt vendor/ffmpeg/current/
          cp ffmpeg-slices/arm64/build-configuration.txt vendor/ffmpeg/current/build-configuration-arm64.txt
          cp ffmpeg-slices/x64/build-configuration.txt vendor/ffmpeg/current/build-configuration-x64.txt
          {
            echo "Universal binary assembled from the following independently verified configurations."
            echo
            echo "=== arm64 ==="
            cat vendor/ffmpeg/current/build-configuration-arm64.txt
            echo
            echo "=== x64 ==="
            cat vendor/ffmpeg/current/build-configuration-x64.txt
          } > vendor/ffmpeg/current/build-configuration.txt

      - name: Test with the release FFmpeg
        run: npm test

      - name: Build application assets
        run: npm run build

      - name: Build signed and notarized universal app
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          for required in \
            MAC_CSC_LINK \
            MAC_CSC_KEY_PASSWORD \
            APPLE_API_KEY_B64 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER; do
            if [[ -z "${!required:-}" ]]; then
              echo "Missing protected release-environment secret: $required" >&2
              exit 1
            fi
          done
          if [[ ! "$APPLE_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "APPLE_API_KEY_ID must be a 10-character team API key ID." >&2
            exit 1
          fi
          if [[ ! "$APPLE_API_ISSUER" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            echo "APPLE_API_ISSUER must be a UUID from an App Store Connect team API key." >&2
            exit 1
          fi
          key_dir="$(mktemp -d "$RUNNER_TEMP/loopdrop-notary.XXXXXX")"
          chmod 0700 "$key_dir"
          key_path="$key_dir/AuthKey_${APPLE_API_KEY_ID}.p8"
          cleanup_key() {
            rm -f -- "$key_path"
            rmdir -- "$key_dir" 2>/dev/null || true
          }
          trap cleanup_key EXIT
          APPLE_API_KEY_B64="$APPLE_API_KEY_B64" KEY_PATH="$key_path" node <<'NODE'
          const { writeFileSync } = require("node:fs");
          const encoded = process.env.APPLE_API_KEY_B64.replace(/\s/g, "");
          if (!encoded || encoded.length % 4 !== 0 || !/^[A-Za-z0-9+/]+={0,2}$/.test(encoded)) {
            throw new Error("APPLE_API_KEY_B64 is not valid base64");
          }
          const key = Buffer.from(encoded, "base64");
          const text = key.toString("utf8").replace(/\r\n/g, "\n");
          const privateKeyPattern = /^-----BEGIN PRIVATE KEY-----\n(?:[A-Za-z0-9+/=]+\n)+-----END PRIVATE KEY-----\n?$/;
          if (!privateKeyPattern.test(text)) {
            throw new Error("APPLE_API_KEY_B64 does not contain an App Store Connect .p8 private key");
          }
          writeFileSync(process.env.KEY_PATH, text, { flag: "wx", mode: 0o600 });
          NODE
          csc_link="$MAC_CSC_LINK"
          csc_key_password="$MAC_CSC_KEY_PASSWORD"
          api_key_id="$APPLE_API_KEY_ID"
          api_issuer="$APPLE_API_ISSUER"
          unset MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_B64 APPLE_API_KEY_ID APPLE_API_ISSUER
          CSC_LINK="$csc_link" \
          CSC_KEY_PASSWORD="$csc_key_password" \
          APPLE_API_KEY="$key_path" \
          APPLE_API_KEY_ID="$api_key_id" \
          APPLE_API_ISSUER="$api_issuer" \
            ./node_modules/.bin/electron-builder \
              --mac \
              --universal \
              --publish never \
              --config.mac.forceCodeSigning=true \
              --config.mac.notarize=true

      - name: Verify signature, notarization, architectures, and packaged FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          apps=()
          while IFS= read -r -d '' candidate; do apps+=("$candidate"); done \
            < <(find release -maxdepth 2 -type d -name '*.app' -print0)
          [[ ${#apps[@]} -eq 1 ]] || { echo "Expected one packaged app, found ${#apps[@]}" >&2; exit 1; }
          app_path="${apps[0]}"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"
          xcrun stapler validate "$app_path"
          main_binary="$app_path/Contents/MacOS/loopdrop"
          packaged_ffmpeg="$app_path/Contents/Resources/ffmpeg/ffmpeg"
          packaged_ffprobe="$app_path/Contents/Resources/ffmpeg/ffprobe"
          test -x "$main_binary"
          test -x "$packaged_ffmpeg"
          test -x "$packaged_ffprobe"
          lipo "$main_binary" -verify_arch arm64 x86_64
          lipo "$packaged_ffmpeg" -verify_arch arm64 x86_64
          lipo "$packaged_ffprobe" -verify_arch arm64 x86_64
          codesign --verify --strict --verbose=2 "$packaged_ffmpeg"
          codesign --verify --strict --verbose=2 "$packaged_ffprobe"
          "$packaged_ffprobe" -hide_banner -version >/dev/null
          node .github/scripts/verify-packaged-licenses.cjs \
            "$app_path/Contents/Resources/licenses" \
            darwin \
            arm64,x64
          smoke_gif="$RUNNER_TEMP/packaged-macos-smoke.gif"
          "$packaged_ffmpeg" \
            -hide_banner -loglevel error -y \
            -filter_complex 'testsrc2=size=160x90:rate=8:duration=1,split[gif][palette];[palette]palettegen=max_colors=64[paletteout];[gif][paletteout]paletteuse[out]' \
            -map '[out]' -an -loop 0 "$smoke_gif"
          test -s "$smoke_gif"
          [[ "$(head -c 6 "$smoke_gif")" == GIF8[79]a ]]

      - name: Stage explicit macOS release files
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          base="loopdrop-${version}-mac-universal"
          files=(
            "release/${base}.dmg"
            "release/${base}.dmg.blockmap"
            "release/${base}.zip"
            "release/${base}.zip.blockmap"
            "release/latest-mac.yml"
          )
          for file in "${files[@]}"; do
            [[ -f "$file" && ! -L "$file" ]] || { echo "Missing regular release file: $file" >&2; exit 1; }
          done
          [[ ! -e upload ]] || { echo "Refusing to reuse a pre-existing upload path." >&2; exit 1; }
          mkdir upload
          cp "${files[@]}" upload/
          cp vendor/ffmpeg/current/build-configuration-arm64.txt upload/ffmpeg-build-configuration-macos-arm64.txt
          cp vendor/ffmpeg/current/build-configuration-x64.txt upload/ffmpeg-build-configuration-macos-x64.txt

      - name: Upload macOS release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-universal
          path: upload/
          if-no-files-found: error
          retention-days: 14

  package-windows:
    name: Package signed Windows x64 app
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 75
    environment: release
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Set up MSYS2 build tools
        id: msys2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-pkgconf

      - name: Build pinned LGPL-only FFmpeg
        env:
          LOOPDROP_MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
        shell: pwsh
        run: ./scripts/build-ffmpeg-windows.ps1 -OutputDirectory vendor/ffmpeg/current

      - name: Test with the release FFmpeg
        run: npm test

      - name: Build application assets
        run: npm run build

      - name: Build signed Windows installer
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK)) {
            throw "Missing protected release-environment secret: WIN_CSC_LINK"
          }
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw "Missing protected release-environment secret: WIN_CSC_KEY_PASSWORD"
          }
          $env:CSC_LINK = $env:WIN_CSC_LINK
          $env:CSC_KEY_PASSWORD = $env:WIN_CSC_KEY_PASSWORD
          Remove-Item Env:\WIN_CSC_LINK
          Remove-Item Env:\WIN_CSC_KEY_PASSWORD
          & .\node_modules\.bin\electron-builder.cmd `
            --win `
            --x64 `
            --publish never `
            --config.win.forceCodeSigning=true
          if ($LASTEXITCODE -ne 0) {
            throw "electron-builder failed with exit code $LASTEXITCODE."
          }

      - name: Verify Authenticode signatures and packaged FFmpeg
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) { throw "Unable to read the package version." }
          $installerPath = "release/loopdrop-$version-win-x64.exe"
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw "The expected Windows installer was not produced: $installerPath"
          }
          $installer = Get-Item -LiteralPath $installerPath
          $appBinaries = @(Get-ChildItem -LiteralPath release -Recurse -File -Filter loopdrop.exe |
            Where-Object { $_.FullName -match 'win-unpacked[\\/]loopdrop\.exe$' })
          if ($appBinaries.Count -ne 1) {
            throw "Expected one unpacked application executable, found $($appBinaries.Count)."
          }
          $packagedFfmpegs = @(Get-ChildItem -LiteralPath release -Recurse -File -Filter ffmpeg.exe |
            Where-Object { $_.FullName -match 'win-unpacked[\\/]resources[\\/]ffmpeg[\\/]ffmpeg\.exe$' })
          if ($packagedFfmpegs.Count -ne 1) {
            throw "Expected one packaged FFmpeg executable, found $($packagedFfmpegs.Count)."
          }
          $packagedFfprobes = @(Get-ChildItem -LiteralPath release -Recurse -File -Filter ffprobe.exe |
            Where-Object { $_.FullName -match 'win-unpacked[\\/]resources[\\/]ffmpeg[\\/]ffprobe\.exe$' })
          if ($packagedFfprobes.Count -ne 1) {
            throw "Expected one packaged FFprobe executable, found $($packagedFfprobes.Count)."
          }
          $appBinary = $appBinaries[0]
          $packagedFfmpeg = $packagedFfmpegs[0]
          $packagedFfprobe = $packagedFfprobes[0]
          foreach ($file in @($installer, $appBinary, $packagedFfmpeg, $packagedFfprobe)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
              throw "Invalid Authenticode signature on $($file.FullName): $($signature.Status)"
            }
          }
          & $packagedFfprobe.FullName -hide_banner -version | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "The packaged FFprobe executable failed to start." }
          $licenseDirectory = Join-Path $packagedFfmpeg.Directory.Parent.FullName "licenses"
          & node .github/scripts/verify-packaged-licenses.cjs $licenseDirectory win32 x64
          if ($LASTEXITCODE -ne 0) { throw "Packaged license verification failed." }
          $smokeGif = Join-Path $env:RUNNER_TEMP "packaged-windows-smoke.gif"
          & $packagedFfmpeg.FullName `
            -hide_banner -loglevel error -y `
            -filter_complex 'testsrc2=size=160x90:rate=8:duration=1,split[gif][palette];[palette]palettegen=max_colors=64[paletteout];[gif][paletteout]paletteuse[out]' `
            -map '[out]' -an -loop 0 $smokeGif
          if ($LASTEXITCODE -ne 0) { throw "The packaged FFmpeg smoke test failed." }
          $bytes = [System.IO.File]::ReadAllBytes($smokeGif)
          $header = if ($bytes.Length -ge 6) { [System.Text.Encoding]::ASCII.GetString($bytes, 0, 6) } else { "" }
          if ($header -notin @("GIF87a", "GIF89a")) {
            throw "The packaged FFmpeg smoke test did not create a valid GIF."
          }

      - name: Stage explicit Windows release files
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) { throw "Unable to read the package version." }
          $base = "loopdrop-$version-win-x64.exe"
          $files = @(
            "release/$base",
            "release/$base.blockmap",
            "release/latest.yml"
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Missing regular release file: $file"
            }
          }
          if (Test-Path -LiteralPath upload) {
            throw "Refusing to reuse a pre-existing upload path."
          }
          New-Item -ItemType Directory -Path upload | Out-Null
          Copy-Item -LiteralPath $files -Destination upload
          Copy-Item -LiteralPath vendor/ffmpeg/current/build-configuration.txt -Destination upload/ffmpeg-build-configuration-windows-x64.txt

      - name: Upload Windows release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x64
          path: upload/
          if-no-files-found: error
          retention-days: 14

  package-linux:
    name: Package Linux ${{ matrix.arch }} app
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install FFmpeg build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libdigest-sha-perl nasm pkg-config xz-utils

      - name: Build pinned LGPL-only FFmpeg
        run: ./scripts/build-ffmpeg-unix.sh vendor/ffmpeg/current

      - name: Verify FFmpeg policy and functionality
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat vendor/ffmpeg/current/version.txt)" = "$FFMPEG_VERSION"
          ! grep -Eq -- '--enable-(gpl|nonfree|version3)' vendor/ffmpeg/current/build-configuration.txt
          filters="$(vendor/ffmpeg/current/ffmpeg -hide_banner -filters 2>/dev/null)"
          grep -Fq palettegen <<<"$filters"
          grep -Fq paletteuse <<<"$filters"
          smoke_gif="$RUNNER_TEMP/ffmpeg-${{ matrix.arch }}-smoke.gif"
          vendor/ffmpeg/current/ffmpeg \
            -hide_banner -loglevel error -y \
            -filter_complex 'testsrc2=size=160x90:rate=8:duration=1,split[gif][palette];[palette]palettegen=max_colors=64[paletteout];[gif][paletteout]paletteuse[out]' \
            -map '[out]' -an -loop 0 "$smoke_gif"
          test -s "$smoke_gif"
          [[ "$(head -c 6 "$smoke_gif")" == GIF8[79]a ]]

      - name: Test with the release FFmpeg
        run: npm test

      - name: Build Linux packages
        run: |
          npm run build
          ./node_modules/.bin/electron-builder --linux --${{ matrix.arch }} --publish never

      - name: Verify packaged FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          packaged_ffmpegs=()
          while IFS= read -r -d '' candidate; do packaged_ffmpegs+=("$candidate"); done \
            < <(find release -type f -path '*/resources/ffmpeg/ffmpeg' -print0)
          [[ ${#packaged_ffmpegs[@]} -eq 1 ]] || {
            echo "Expected one packaged FFmpeg executable, found ${#packaged_ffmpegs[@]}." >&2
            exit 1
          }
          packaged_ffmpeg="${packaged_ffmpegs[0]}"
          packaged_ffprobe="$(dirname "$packaged_ffmpeg")/ffprobe"
          test -x "$packaged_ffmpeg"
          test -x "$packaged_ffprobe"
          "$packaged_ffprobe" -hide_banner -version >/dev/null
          resources_dir="$(dirname "$(dirname "$packaged_ffmpeg")")"
          node .github/scripts/verify-packaged-licenses.cjs \
            "$resources_dir/licenses" \
            linux \
            "${{ matrix.arch }}"
          smoke_gif="$RUNNER_TEMP/packaged-linux-${{ matrix.arch }}-smoke.gif"
          "$packaged_ffmpeg" \
            -hide_banner -loglevel error -y \
            -filter_complex 'testsrc2=size=160x90:rate=8:duration=1,split[gif][palette];[palette]palettegen=max_colors=64[paletteout];[gif][paletteout]paletteuse[out]' \
            -map '[out]' -an -loop 0 "$smoke_gif"
          test -s "$smoke_gif"
          [[ "$(head -c 6 "$smoke_gif")" == GIF8[79]a ]]

      - name: Stage explicit Linux release files
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "${{ matrix.arch }}" == "x64" ]]; then
            appimage_arch="x86_64"
            deb_arch="amd64"
            manifest="latest-linux.yml"
          else
            appimage_arch="arm64"
            deb_arch="arm64"
            manifest="latest-linux-arm64.yml"
          fi
          files=(
            "release/loopdrop-${version}-linux-${appimage_arch}.AppImage"
            "release/loopdrop-${version}-linux-${deb_arch}.deb"
            "release/${manifest}"
          )
          for file in "${files[@]}"; do
            [[ -f "$file" && ! -L "$file" ]] || { echo "Missing regular release file: $file" >&2; exit 1; }
          done
          [[ ! -e upload ]] || { echo "Refusing to reuse a pre-existing upload path." >&2; exit 1; }
          mkdir upload
          cp "${files[@]}" upload/
          cp vendor/ffmpeg/current/build-configuration.txt "upload/ffmpeg-build-configuration-linux-${{ matrix.arch }}.txt"

      - name: Upload Linux release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ matrix.arch }}
          path: upload/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create draft GitHub release
    needs:
      - package-macos
      - package-windows
      - package-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare empty artifact directories
        shell: bash
        run: |
          set -euo pipefail
          [[ ! -e release-parts && ! -e release-assets ]] || {
            echo "Refusing to reuse release artifact paths from the tagged source." >&2
            exit 1
          }
          mkdir release-parts

      - name: Download macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos-universal
          path: release-parts/macos
          digest-mismatch: error

      - name: Download Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-windows-x64
          path: release-parts/windows
          digest-mismatch: error

      - name: Download Linux x64 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-linux-x64
          path: release-parts/linux-x64
          digest-mismatch: error

      - name: Download Linux arm64 artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-linux-arm64
          path: release-parts/linux-arm64
          digest-mismatch: error

      - name: Collect only the expected built assets
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          sources=(
            "release-parts/macos/loopdrop-${version}-mac-universal.dmg"
            "release-parts/macos/loopdrop-${version}-mac-universal.dmg.blockmap"
            "release-parts/macos/loopdrop-${version}-mac-universal.zip"
            "release-parts/macos/loopdrop-${version}-mac-universal.zip.blockmap"
            "release-parts/macos/latest-mac.yml"
            "release-parts/macos/ffmpeg-build-configuration-macos-arm64.txt"
            "release-parts/macos/ffmpeg-build-configuration-macos-x64.txt"
            "release-parts/windows/loopdrop-${version}-win-x64.exe"
            "release-parts/windows/loopdrop-${version}-win-x64.exe.blockmap"
            "release-parts/windows/latest.yml"
            "release-parts/windows/ffmpeg-build-configuration-windows-x64.txt"
            "release-parts/linux-x64/loopdrop-${version}-linux-x86_64.AppImage"
            "release-parts/linux-x64/loopdrop-${version}-linux-amd64.deb"
            "release-parts/linux-x64/latest-linux.yml"
            "release-parts/linux-x64/ffmpeg-build-configuration-linux-x64.txt"
            "release-parts/linux-arm64/loopdrop-${version}-linux-arm64.AppImage"
            "release-parts/linux-arm64/loopdrop-${version}-linux-arm64.deb"
            "release-parts/linux-arm64/latest-linux-arm64.yml"
            "release-parts/linux-arm64/ffmpeg-build-configuration-linux-arm64.txt"
          )
          for source in "${sources[@]}"; do
            [[ -f "$source" && ! -L "$source" ]] || {
              echo "Missing regular release asset: $source" >&2
              exit 1
            }
          done
          mkdir release-assets
          cp "${sources[@]}" release-assets/

      - name: Verify and include corresponding FFmpeg source
        shell: bash
        run: |
          set -euo pipefail
          archive="ffmpeg-${FFMPEG_VERSION}.tar.xz"
          signature="${archive}.asc"
          curl --fail --location --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 \
            "https://ffmpeg.org/releases/${archive}" \
            --output "release-assets/${archive}"
          curl --fail --location --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 \
            "https://ffmpeg.org/releases/${signature}" \
            --output "release-assets/${signature}"
          curl --fail --location --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 \
            "https://ffmpeg.org/ffmpeg-devel.asc" \
            --output "release-assets/ffmpeg-release-signing-key.asc"
          echo "${FFMPEG_SHA256}  release-assets/${archive}" | sha256sum --check --strict
          export GNUPGHOME="$RUNNER_TEMP/loopdrop-gnupg"
          install -d -m 0700 "$GNUPGHOME"
          gpg --batch --import release-assets/ffmpeg-release-signing-key.asc
          fingerprint="$(gpg --batch --with-colons --fingerprint 'ffmpeg-devel@ffmpeg.org' | awk -F: '$1 == "fpr" { print $10; exit }')"
          expected_fingerprint="FCF986EA15E6E293A5644F10B4322F04D67658D8"
          if [[ "$fingerprint" != "$expected_fingerprint" ]]; then
            echo "Unexpected FFmpeg release-key fingerprint: $fingerprint" >&2
            exit 1
          fi
          gpg --batch --verify "release-assets/${signature}" "release-assets/${archive}"
          tar -xOf "release-assets/${archive}" \
            "ffmpeg-${FFMPEG_VERSION}/COPYING.LGPLv2.1" \
            > release-assets/FFMPEG-COPYING.LGPLv2.1
          tar -xOf "release-assets/${archive}" \
            "ffmpeg-${FFMPEG_VERSION}/LICENSE.md" \
            > release-assets/FFMPEG-LICENSE.md

      - name: Add notices and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp THIRD_PARTY_NOTICES.md release-assets/
          if find release-assets -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            echo "Release assets must contain regular files only." >&2
            exit 1
          fi
          (
            cd release-assets
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum \
              | sed 's#  \./#  #'
          ) > release-assets/SHA256SUMS
          (cd release-assets && sha256sum --check SHA256SUMS)

      - name: Generate GitHub artifact attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-assets/SHA256SUMS

      - name: Create or update a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          assets=(release-assets/*)
          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "Refusing to replace assets on an already-published release." >&2
              exit 1
            fi
            mapfile -t existing_assets < <(gh release view "$tag" --json assets --jq '.assets[].name')
            for existing in "${existing_assets[@]}"; do
              if [[ "$existing" != "${existing##*/}" || "$existing" == "." || "$existing" == ".." ]]; then
                echo "Draft release contains an unsafe asset name; remove it manually before rerunning." >&2
                exit 1
              fi
              if [[ ! -f "release-assets/$existing" ]]; then
                echo "Draft release contains unexpected asset '$existing'; remove it manually before rerunning." >&2
                exit 1
              fi
            done
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --draft \
              --generate-notes \
              --title "Loopdrop ${tag}" \
              --verify-tag
          fi
