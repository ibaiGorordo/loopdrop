name: Release native macOS app

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_TEAM_ID: F83T9W2BS8

jobs:
  validate:
    name: Validate native source and tag
    if: github.repository == 'ibaiGorordo/loopdrop'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the stable annotated tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != push ] || [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "Releases must be triggered by a pushed tag." >&2
            exit 1
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must be stable semantic versions such as v0.2.0." >&2
            exit 1
          fi
          if [ "$(git cat-file -t "$GITHUB_REF")" != tag ]; then
            echo "Release tags must be annotated, not lightweight." >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          test "$tag_commit" = "$(git rev-parse HEAD)"
          git show-ref --verify --quiet refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$tag_commit" refs/remotes/origin/main; then
            echo "The release tag must point to a commit reachable from origin/main." >&2
            exit 1
          fi

          source_version="$(/usr/bin/plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          source_build="$(/usr/bin/plutil -extract CFBundleVersion raw Resources/Info.plist)"
          test "$GITHUB_REF_NAME" = "v${source_version}"
          case "$source_build" in
            ''|0|*[!0-9]*) echo "CFBundleVersion must be a positive integer." >&2; exit 1 ;;
          esac

      - name: Verify source, license, and dependency policy
        shell: bash
        run: |
          set -euo pipefail
          test -f Package.swift
          test -d Sources/LoopdropNative
          test -d Tests/LoopdropNativeTests
          test -x scripts/build-app.sh
          command -v jq >/dev/null

          dependency_graph="$RUNNER_TEMP/loopdrop-swift-dependencies.json"
          xcrun swift package show-dependencies --format json > "$dependency_graph"
          jq -e '.dependencies | type == "array" and length == 0' "$dependency_graph" >/dev/null

          grep -Fxq "MIT License" LICENSE
          grep -Fq "Permission is hereby granted, free of charge" LICENSE
          grep -Fq "THE SOFTWARE IS PROVIDED \"AS IS\"" LICENSE
          test "$(/usr/bin/plutil -extract CFBundleIdentifier raw Resources/Info.plist)" = \
            "io.github.ibaigorordo.loopdrop"
          test "$(/usr/bin/plutil -extract LSMinimumSystemVersion raw Resources/Info.plist)" = \
            "13.0"

      - name: Run native release tests
        run: >-
          xcrun swift test --configuration release
          -Xswiftc -strict-concurrency=complete
          -Xswiftc -warnings-as-errors

  package-macos:
    name: Sign, notarize, and package universal macOS app
    needs: validate
    runs-on: macos-15
    timeout-minutes: 75
    environment: release
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the universal application
        shell: bash
        run: |
          set -euo pipefail
          version="$(/usr/bin/plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          build_number="$(/usr/bin/plutil -extract CFBundleVersion raw Resources/Info.plist)"
          test "$GITHUB_REF_NAME" = "v${version}"
          LOOPDROP_CONFIGURATION=release \
          LOOPDROP_MARKETING_VERSION="$version" \
          LOOPDROP_BUILD_NUMBER="$build_number" \
            ./scripts/build-app.sh

      - name: Sign, notarize, package, and verify
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          for required in \
            MAC_CSC_LINK \
            MAC_CSC_KEY_PASSWORD \
            APPLE_API_KEY_B64 \
            APPLE_API_KEY_ID \
            APPLE_API_ISSUER; do
            if [ -z "${!required:-}" ]; then
              echo "Missing protected release-environment secret: $required" >&2
              exit 1
            fi
          done
          if [[ ! "$APPLE_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "APPLE_API_KEY_ID must be a ten-character Team API key ID." >&2
            exit 1
          fi
          if [[ ! "$APPLE_API_ISSUER" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            echo "APPLE_API_ISSUER must be a Team API key issuer UUID." >&2
            exit 1
          fi

          app=".build/app/loopdrop.app"
          version="$(/usr/bin/plutil -extract CFBundleShortVersionString raw Resources/Info.plist)"
          build_number="$(/usr/bin/plutil -extract CFBundleVersion raw Resources/Info.plist)"
          base="loopdrop-${version}-mac-universal"
          work_dir="$(/usr/bin/mktemp -d "$RUNNER_TEMP/loopdrop-release.XXXXXX")"
          keychain="$work_dir/signing.keychain-db"
          certificate="$work_dir/developer-id-application.p12"
          api_key="$work_dir/AuthKey_${APPLE_API_KEY_ID}.p8"
          mounted_device=

          cleanup() {
            if [ -n "${mounted_device:-}" ]; then
              /usr/bin/hdiutil detach "$mounted_device" -quiet >/dev/null 2>&1 || true
            fi
            if [ -n "${keychain:-}" ] && [ -e "$keychain" ]; then
              /usr/bin/security delete-keychain "$keychain" >/dev/null 2>&1 || true
            fi
            if [ -n "${work_dir:-}" ] && [ -d "$work_dir" ]; then
              /usr/bin/find "$work_dir" -depth -delete
            fi
          }
          trap cleanup EXIT HUP INT TERM

          decode_base64() {
            encoded="$1"
            destination="$2"
            case "$encoded" in
              data:*';base64,'*) encoded="${encoded#*,}" ;;
            esac
            printf '%s' "$encoded" | /usr/bin/tr -d '[:space:]' | \
              /usr/bin/base64 -D > "$destination"
            test -s "$destination"
          }

          decode_base64 "$MAC_CSC_LINK" "$certificate"
          decode_base64 "$APPLE_API_KEY_B64" "$api_key"
          unset MAC_CSC_LINK APPLE_API_KEY_B64
          test "$(/usr/bin/sed -n '1p' "$api_key")" = "-----BEGIN PRIVATE KEY-----"
          test "$(/usr/bin/awk 'NF { line=$0 } END { print line }' "$api_key")" = \
            "-----END PRIVATE KEY-----"

          keychain_password="$(/usr/bin/openssl rand -hex 32)"
          /usr/bin/security create-keychain -p "$keychain_password" "$keychain"
          /usr/bin/security set-keychain-settings -lut 21600 "$keychain"
          /usr/bin/security unlock-keychain -p "$keychain_password" "$keychain"
          /usr/bin/security import "$certificate" \
            -k "$keychain" \
            -P "$MAC_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security >/dev/null
          unset MAC_CSC_KEY_PASSWORD
          /bin/rm -f "$certificate"
          /usr/bin/security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain" >/dev/null
          /usr/bin/security list-keychains -d user -s "$keychain"

          identity_lines="$(/usr/bin/security find-identity -v -p codesigning "$keychain" | \
            /usr/bin/grep '"Developer ID Application:' || true)"
          identity_count="$(printf '%s\n' "$identity_lines" | \
            /usr/bin/awk 'NF { count++ } END { print count + 0 }')"
          if [ "$identity_count" -ne 1 ]; then
            echo "Expected exactly one valid Developer ID Application identity; found $identity_count." >&2
            exit 1
          fi
          if ! printf '%s\n' "$identity_lines" | /usr/bin/grep -Fq "($EXPECTED_TEAM_ID)"; then
            echo "The Developer ID Application identity has the wrong Apple team." >&2
            exit 1
          fi
          identity_sha="$(printf '%s\n' "$identity_lines" | /usr/bin/awk 'NF { print $2; exit }')"
          if [[ ! "$identity_sha" =~ ^[0-9A-Fa-f]{40}$ ]]; then
            echo "Could not resolve the Developer ID Application identity hash." >&2
            exit 1
          fi

          validate_bundle() {
            bundle="$1"
            bundle_plist="$bundle/Contents/Info.plist"
            bundle_binary="$bundle/Contents/MacOS/loopdrop"
            test -d "$bundle"
            test -f "$bundle_plist"
            test -x "$bundle_binary"
            test ! -e "$bundle/Contents/Frameworks"
            test -f "$bundle/Contents/Resources/LICENSE"
            test -f "$bundle/Contents/Resources/Loopdrop.icns"
            test -f "$bundle/Contents/_CodeSignature/CodeResources"
            cmp -s LICENSE "$bundle/Contents/Resources/LICENSE"
            if /usr/bin/find "$bundle" -type l -print -quit | /usr/bin/grep -q .; then
              echo "The application bundle must not contain symlinks." >&2
              exit 1
            fi
            bundled_file_count=0
            while IFS= read -r bundled_file; do
              bundled_file_count=$((bundled_file_count + 1))
              relative_file="${bundled_file#"$bundle"/}"
              case "$relative_file" in
                Contents/Info.plist|\
                Contents/MacOS/loopdrop|\
                Contents/CodeResources|\
                Contents/Resources/LICENSE|\
                Contents/Resources/Loopdrop.icns|\
                Contents/_CodeSignature/CodeResources) ;;
                *) echo "Unexpected file in application bundle: $relative_file" >&2; exit 1 ;;
              esac
            done < <(/usr/bin/find "$bundle" -type f | /usr/bin/sort)
            if [ "$bundled_file_count" -lt 5 ] || [ "$bundled_file_count" -gt 6 ]; then
              echo "Unexpected application bundle file count: $bundled_file_count" >&2
              exit 1
            fi
            test "$(/usr/bin/plutil -extract CFBundleIdentifier raw "$bundle_plist")" = \
              "io.github.ibaigorordo.loopdrop"
            test "$(/usr/bin/plutil -extract CFBundleDisplayName raw "$bundle_plist")" = "Loopdrop"
            test "$(/usr/bin/plutil -extract CFBundleExecutable raw "$bundle_plist")" = "loopdrop"
            test "$(/usr/bin/plutil -extract CFBundleShortVersionString raw "$bundle_plist")" = "$version"
            test "$(/usr/bin/plutil -extract CFBundleVersion raw "$bundle_plist")" = "$build_number"
            test "$(/usr/bin/plutil -extract LSMinimumSystemVersion raw "$bundle_plist")" = "13.0"
            test "$(/usr/bin/plutil -extract LSUIElement raw "$bundle_plist")" = "true"

            /usr/bin/xcrun lipo "$bundle_binary" -verify_arch arm64 x86_64
            packaged_archs="$(/usr/bin/xcrun lipo -archs "$bundle_binary")"
            packaged_arch_count=0
            packaged_has_arm64=false
            packaged_has_x86_64=false
            for packaged_arch in $packaged_archs; do
              packaged_arch_count=$((packaged_arch_count + 1))
              case "$packaged_arch" in
                arm64) packaged_has_arm64=true ;;
                x86_64) packaged_has_x86_64=true ;;
                *) echo "Unexpected packaged architecture: $packaged_arch" >&2; exit 1 ;;
              esac
            done
            test "$packaged_arch_count" -eq 2
            test "$packaged_has_arm64" = true
            test "$packaged_has_x86_64" = true

            for packaged_arch in arm64 x86_64; do
              packaged_minos="$(/usr/bin/xcrun vtool \
                -arch "$packaged_arch" \
                -show-build "$bundle_binary" | \
                /usr/bin/awk '$1 == "minos" { print $2; found = 1; exit } END { if (!found) exit 1 }')"
              case "$packaged_minos" in
                13.0|13.0.0) ;;
                *)
                  echo "$packaged_arch slice has unexpected minimum macOS version: $packaged_minos" >&2
                  exit 1
                  ;;
              esac

              while IFS= read -r dependency; do
                case "$dependency" in
                  /System/Library/*|/usr/lib/*) ;;
                  *)
                    echo "$packaged_arch slice has a non-system dependency: $dependency" >&2
                    exit 1
                    ;;
                esac
              done < <(/usr/bin/otool -arch "$packaged_arch" -L "$bundle_binary" | \
                /usr/bin/tail -n +2 | /usr/bin/awk '{ print $1 }')
            done

            bundle_kib="$(/usr/bin/du -sk "$bundle" | /usr/bin/awk '{ print $1 }')"
            if [ "$bundle_kib" -gt 10240 ]; then
              echo "Application bundle is unexpectedly large: ${bundle_kib} KiB" >&2
              exit 1
            fi
          }

          validate_signature() {
            signed_path="$1"
            /usr/bin/codesign --verify --deep --strict --verbose=2 "$signed_path"
            signature_info="$(/usr/bin/codesign -dv --verbose=4 "$signed_path" 2>&1)"
            printf '%s\n' "$signature_info" | \
              /usr/bin/grep -Fq "Authority=Developer ID Application:"
            printf '%s\n' "$signature_info" | \
              /usr/bin/grep -Fq "TeamIdentifier=$EXPECTED_TEAM_ID"
            printf '%s\n' "$signature_info" | /usr/bin/grep -Eq '^Timestamp=.+$'
          }

          submit_for_notarization() {
            submission="$1"
            label="$2"
            result="$work_dir/notary-${label}.plist"
            /usr/bin/xcrun notarytool submit "$submission" \
              --key "$api_key" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" \
              --wait \
              --timeout 30m \
              --output-format plist > "$result"
            status="$(/usr/bin/plutil -extract status raw "$result")"
            if [ "$status" != Accepted ]; then
              submission_id="$(/usr/bin/plutil -extract id raw "$result")"
              /usr/bin/xcrun notarytool log "$submission_id" \
                --key "$api_key" \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER" || true
              echo "Apple rejected the $label notarization submission." >&2
              exit 1
            fi
          }

          validate_bundle "$app"
          /usr/bin/codesign \
            --force \
            --sign "$identity_sha" \
            --options runtime \
            --timestamp \
            "$app"
          validate_signature "$app"
          app_signature_info="$(/usr/bin/codesign -dv --verbose=4 "$app" 2>&1)"
          if ! printf '%s\n' "$app_signature_info" | /usr/bin/grep -Eq 'flags=.*\(runtime\)'; then
            echo "The application signature does not enable the hardened runtime." >&2
            exit 1
          fi

          notary_zip="$work_dir/notary-upload.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app" "$notary_zip"
          submit_for_notarization "$notary_zip" app
          /usr/bin/xcrun stapler staple -v "$app"
          /usr/bin/xcrun stapler validate -v "$app"
          validate_bundle "$app"
          validate_signature "$app"
          /usr/sbin/spctl --assess --type execute --verbose=4 "$app"

          if [ -e release-assets ]; then
            echo "Refusing to reuse a pre-existing release-assets path." >&2
            exit 1
          fi
          /bin/mkdir release-assets

          final_zip="release-assets/${base}.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$app" "$final_zip"
          test -s "$final_zip"

          zip_extract="$work_dir/zip-extract"
          /bin/mkdir "$zip_extract"
          /usr/bin/ditto -x -k "$final_zip" "$zip_extract"
          test -d "$zip_extract/loopdrop.app"
          if /usr/bin/find "$zip_extract" -mindepth 1 -maxdepth 1 \
            ! -name loopdrop.app ! -name __MACOSX -print -quit | /usr/bin/grep -q .; then
            echo "The update ZIP has unexpected top-level contents." >&2
            exit 1
          fi
          validate_bundle "$zip_extract/loopdrop.app"
          validate_signature "$zip_extract/loopdrop.app"
          /usr/bin/xcrun stapler validate -v "$zip_extract/loopdrop.app"
          /usr/sbin/spctl --assess --type execute --verbose=4 "$zip_extract/loopdrop.app"

          dmg_root="$work_dir/dmg-root"
          /bin/mkdir "$dmg_root"
          /usr/bin/ditto "$app" "$dmg_root/loopdrop.app"
          /bin/ln -s /Applications "$dmg_root/Applications"
          test -d "$dmg_root/loopdrop.app"
          test -L "$dmg_root/Applications"
          test "$(/usr/bin/readlink "$dmg_root/Applications")" = /Applications
          test "$(/usr/bin/find "$dmg_root" -mindepth 1 -maxdepth 1 | /usr/bin/wc -l | /usr/bin/tr -d ' ')" = 2

          final_dmg="release-assets/${base}.dmg"
          /usr/bin/hdiutil create \
            -volname Loopdrop \
            -srcfolder "$dmg_root" \
            -format UDZO \
            -ov \
            "$final_dmg"
          /usr/bin/hdiutil verify "$final_dmg"
          /usr/bin/codesign --force --sign "$identity_sha" --timestamp "$final_dmg"
          validate_signature "$final_dmg"
          submit_for_notarization "$final_dmg" dmg
          /usr/bin/xcrun stapler staple -v "$final_dmg"
          /usr/bin/xcrun stapler validate -v "$final_dmg"
          /usr/bin/hdiutil verify "$final_dmg"
          validate_signature "$final_dmg"
          /usr/sbin/spctl \
            --assess \
            --type open \
            --context context:primary-signature \
            --verbose=4 \
            "$final_dmg"

          mount_point="$work_dir/dmg-mount"
          /bin/mkdir "$mount_point"
          attach_output="$(/usr/bin/hdiutil attach \
            -nobrowse \
            -readonly \
            -mountpoint "$mount_point" \
            "$final_dmg")"
          mounted_device="$(printf '%s\n' "$attach_output" | \
            /usr/bin/awk '$1 ~ /^\/dev\// { print $1; exit }')"
          test -n "$mounted_device"
          test -d "$mount_point/loopdrop.app"
          test -L "$mount_point/Applications"
          test "$(/usr/bin/readlink "$mount_point/Applications")" = /Applications
          validate_bundle "$mount_point/loopdrop.app"
          validate_signature "$mount_point/loopdrop.app"
          /usr/bin/xcrun stapler validate -v "$mount_point/loopdrop.app"
          /usr/sbin/spctl --assess --type execute --verbose=4 "$mount_point/loopdrop.app"
          /usr/bin/hdiutil detach "$mounted_device" -quiet
          mounted_device=

          zip_size="$(/usr/bin/stat -f '%z' "$final_zip")"
          dmg_size="$(/usr/bin/stat -f '%z' "$final_dmg")"
          for packaged_size in "$zip_size" "$dmg_size"; do
            if [ "$packaged_size" -le 0 ] || [ "$packaged_size" -gt 15728640 ]; then
              echo "A packaged release file has an unexpected size: $packaged_size bytes" >&2
              exit 1
            fi
          done
          zip_sha512="$(/usr/bin/openssl dgst -sha512 -binary "$final_zip" | \
            /usr/bin/openssl base64 -A)"
          release_date="$(/bin/date -u '+%Y-%m-%dT%H:%M:%S.000Z')"
          manifest="release-assets/latest-mac.yml"
          {
            printf 'version: %s\n' "$version"
            printf 'files:\n'
            printf '  - url: %s.zip\n' "$base"
            printf '    sha512: %s\n' "$zip_sha512"
            printf '    size: %s\n' "$zip_size"
            printf 'path: %s.zip\n' "$base"
            printf 'sha512: %s\n' "$zip_sha512"
            printf "releaseDate: '%s'\n" "$release_date"
          } > "$manifest"

          test "$(/usr/bin/awk '/^version: / { print $2 }' "$manifest")" = "$version"
          test "$(/usr/bin/awk '/^  - url: / { print $3 }' "$manifest")" = "${base}.zip"
          test "$(/usr/bin/awk '/^    sha512: / { print $2 }' "$manifest")" = "$zip_sha512"
          test "$(/usr/bin/awk '/^    size: / { print $2 }' "$manifest")" = "$zip_size"
          test "$(/usr/bin/awk '/^path: / { print $2 }' "$manifest")" = "${base}.zip"
          test "$(/usr/bin/awk '/^sha512: / { print $2 }' "$manifest")" = "$zip_sha512"
          test "$(/usr/bin/grep -c '^  - url: ' "$manifest")" -eq 1

          (
            cd release-assets
            /usr/bin/shasum -a 256 "${base}.dmg" "${base}.zip" latest-mac.yml > SHA256SUMS
            /usr/bin/shasum -a 256 -c SHA256SUMS
          )

          asset_count="$(/usr/bin/find release-assets -mindepth 1 -maxdepth 1 -type f | \
            /usr/bin/wc -l | /usr/bin/tr -d ' ')"
          test "$asset_count" = 4
          if /usr/bin/find release-assets -mindepth 1 -maxdepth 1 ! -type f \
            -print -quit | /usr/bin/grep -q .; then
            echo "Release assets must contain regular files only." >&2
            exit 1
          fi
          for expected in \
            "${base}.dmg" \
            "${base}.zip" \
            latest-mac.yml \
            SHA256SUMS; do
            test -f "release-assets/$expected"
          done

      - name: Upload the verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-universal
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Create draft GitHub release
    needs: package-macos
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare an empty download directory
        shell: bash
        run: |
          set -euo pipefail
          test ! -e release-assets
          mkdir release-assets

      - name: Download the verified macOS assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-macos-universal
          path: release-assets
          digest-mismatch: error

      - name: Revalidate the exact release asset set
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          base="loopdrop-${version}-mac-universal"
          expected=(
            "${base}.dmg"
            "${base}.zip"
            latest-mac.yml
            SHA256SUMS
          )
          for asset in "${expected[@]}"; do
            test -f "release-assets/$asset"
            test ! -L "release-assets/$asset"
          done
          for payload in "release-assets/${base}.dmg" "release-assets/${base}.zip"; do
            payload_size="$(stat -c '%s' "$payload")"
            if [ "$payload_size" -le 0 ] || [ "$payload_size" -gt 15728640 ]; then
              echo "A packaged release file has an unexpected size: $payload_size bytes" >&2
              exit 1
            fi
          done
          test "$(find release-assets -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 4
          if find release-assets -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            echo "Release assets must contain regular files only." >&2
            exit 1
          fi

          (
            cd release-assets
            sha256sum --check --strict SHA256SUMS
          )
          test "$(awk '{ print $2 }' release-assets/SHA256SUMS | sort -u | wc -l)" -eq 3
          for checksummed in "${base}.dmg" "${base}.zip" latest-mac.yml; do
            grep -Eq "^[0-9a-f]{64}  ${checksummed//./\\.}$" release-assets/SHA256SUMS
          done

          manifest="release-assets/latest-mac.yml"
          zip="release-assets/${base}.zip"
          zip_size="$(stat -c '%s' "$zip")"
          zip_sha512="$(openssl dgst -sha512 -binary "$zip" | openssl base64 -A)"
          test "$(awk '/^version: / { print $2 }' "$manifest")" = "$version"
          test "$(awk '/^  - url: / { print $3 }' "$manifest")" = "${base}.zip"
          test "$(awk '/^    sha512: / { print $2 }' "$manifest")" = "$zip_sha512"
          test "$(awk '/^    size: / { print $2 }' "$manifest")" = "$zip_size"
          test "$(awk '/^path: / { print $2 }' "$manifest")" = "${base}.zip"
          test "$(awk '/^sha512: / { print $2 }' "$manifest")" = "$zip_sha512"
          test "$(grep -c '^  - url: ' "$manifest")" -eq 1

      - name: Generate GitHub artifact attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-assets/SHA256SUMS

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          assets=(release-assets/*)
          if gh release view "$tag" >/dev/null 2>&1; then
            is_draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
            if [ "$is_draft" != true ]; then
              echo "Refusing to replace assets on an already-published release." >&2
              exit 1
            fi
            mapfile -t existing_assets < <(gh release view "$tag" --json assets --jq '.assets[].name')
            for existing in "${existing_assets[@]}"; do
              if [ "$existing" != "${existing##*/}" ] || [ "$existing" = . ] || [ "$existing" = .. ]; then
                echo "The draft contains an unsafe asset name; remove it manually." >&2
                exit 1
              fi
              if [ ! -f "release-assets/$existing" ]; then
                echo "The draft contains unexpected asset '$existing'; remove it manually." >&2
                exit 1
              fi
            done
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --draft \
              --generate-notes \
              --title "Loopdrop ${tag}" \
              --verify-tag
          fi
